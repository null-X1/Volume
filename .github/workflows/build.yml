name: Build Audio Panel APK

# Manual run is the primary entry point: Actions -> "Build Audio Panel APK" -> Run workflow.
# A push that touches the ZIP also triggers a build, so the artifact always matches the ZIP.
on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: audio-panel-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # AGP 9.4.x needs JDK 17 (not the newest JDK) and Gradle 9.6+.
      # The project ships a Gradle 9.8.0 wrapper, so Gradle itself is pinned by the ZIP.
      - name: Set up JDK 17 (required by AGP 9.4 / Gradle 9.8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Locate the project ZIP in this repository
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f "android-audio-panel.zip" ]; then
            ZIP="android-audio-panel.zip"
          else
            ZIP="$(find . -maxdepth 3 -type f -name '*.zip' -not -path './.git/*' | sort | head -n 1)"
          fi
          if [ -z "$ZIP" ]; then
            echo "::error::No .zip file found in the repository root. Upload the project ZIP and re-run."
            exit 1
          fi
          echo "Found ZIP: $ZIP"
          echo "zip_file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract the ZIP (no manual extraction needed)
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          fi
          EXTRACT_DIR="$RUNNER_TEMP/project"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "${{ steps.locate.outputs.zip_file }}" -d "$EXTRACT_DIR"
          echo "Extracted files:"
          find "$EXTRACT_DIR" -maxdepth 2 | head -n 40
          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Detect the Android project root (settings.gradle.kts, shallowest first)
        id: project
        shell: bash
        run: |
          set -euo pipefail
          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"
          if [ -z "$EXTRACT_DIR" ]; then EXTRACT_DIR="$RUNNER_TEMP/project"; fi
          CANDIDATES="$(find "$EXTRACT_DIR" -type f -name 'settings.gradle.kts' | sort | awk -F/ '{print NF, $0}' | sort -n | cut -d' ' -f2-)"
          if [ -z "$CANDIDATES" ]; then
            echo "::error::Invalid ZIP: no settings.gradle.kts found anywhere in the archive. The archive must contain the complete Android project."
            echo "Archive contents:"
            find "$EXTRACT_DIR" | head -n 60
            exit 1
          fi
          ROOT=""
          while IFS= read -r candidate; do
            dir="$(dirname "$candidate")"
            if [ -f "$dir/gradlew" ] && [ -f "$dir/gradle/wrapper/gradle-wrapper.jar" ]; then
              ROOT="$dir"
              break
            fi
            if [ -z "$ROOT" ]; then ROOT="$dir"; fi
          done <<< "$CANDIDATES"
          if [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "::error::Invalid ZIP: detected project root '$ROOT' has no settings.gradle.kts."
            exit 1
          fi
          if [ ! -f "$ROOT/gradlew" ]; then
            echo "::error::Invalid ZIP: detected project root '$ROOT' has no gradlew script (Gradle wrapper is required)."
            find "$ROOT" -maxdepth 2 | head -n 40
            exit 1
          fi
          echo "Detected project root: $ROOT"
          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify the ZIP really is a buildable project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.project_root }}"
          ls -la "$ROOT"
          for f in settings.gradle.kts build.gradle.kts gradle.properties gradlew gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -e "$ROOT/$f" ]; then
              echo "::error::Invalid ZIP: required entry '$f' is missing from the project root."
              exit 1
            fi
          done
          echo "Project structure looks complete."

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK platform and build tools this project needs
        shell: bash
        run: |
          set -euo pipefail
          # compileSdk 37 (platform android-37.0) + build-tools 36.0.0 is what AGP 9.4 targets.
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | sed -n '1,40p'

      - name: Show Gradle version from the project wrapper
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.project_root }}"
          chmod +x "$ROOT/gradlew"
          (cd "$ROOT" && ./gradlew --version)

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.project_root }}"
          echo "Project root : $ROOT"
          echo "Build variant: debug (assembleDebug, no release signing required)"
          cd "$ROOT"
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Collect the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.project.outputs.project_root }}"
          OUT="$RUNNER_TEMP/apk"
          rm -rf "$OUT"; mkdir -p "$OUT"
          APK="$(find "$ROOT" -type f -name '*.apk' -path '*debug*' ! -path '*/tmp/*' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find "$ROOT" -type f -name '*.apk' ! -path '*/tmp/*' | head -n 1)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK produced. Diagnostics below."
            echo "--- build directories ---"
            find "$ROOT" -maxdepth 4 -type d -name 'outputs' -o -maxdepth 4 -type d -name 'build' | head -n 20
            echo "--- any files under build outputs ---"
            find "$ROOT" -path '*outputs*' -type f | head -n 40
            exit 1
          fi
          cp "$APK" "$OUT/"
          APK_NAME="$(basename "$APK")"
          SIZE="$(du -h "$OUT/$APK_NAME" | cut -f1)"
          SHA="$(sha256sum "$OUT/$APK_NAME" | cut -d' ' -f1)"
          echo "APK found: $APK"
          echo "Copied to: $OUT/$APK_NAME ($SIZE)"
          echo "sha256: $SHA"
          echo "apk_dir=$OUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Note-Edge-Audio-Panel-APK
          path: ${{ steps.apk.outputs.apk_dir }}/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Audio Panel build"
            echo ""
            echo "- Project root : \`${{ steps.project.outputs.project_root }}\`"
            echo "- ZIP used     : \`${{ steps.locate.outputs.zip_file }}\`"
            echo "- Java         : \`$(java -version 2>&1 | head -n 1)\`"
            echo "- Build variant: debug (assembleDebug)"
            echo "- APK          : \`${{ steps.apk.outputs.apk_name }}\` (${{ steps.apk.outputs.apk_size }})"
            echo "- sha256       : \`${{ steps.apk.outputs.apk_sha }}\`"
            echo ""
            echo "Artifact name: **Infinix-Note-Edge-Audio-Panel-APK**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "BUILD SUCCESSFUL - artifact: Infinix-Note-Edge-Audio-Panel-APK"
